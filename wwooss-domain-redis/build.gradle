dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation project(path: ':wwooss-common')
    implementation project(path: ':wwooss-domain-rds')
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
